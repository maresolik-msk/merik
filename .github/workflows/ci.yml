name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functions:
    name: supabase functions — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `deno test` only compiles the test files and what they import, so an
      # Edge Function with no test of its own is never type-checked. The probe
      # went in with 23 type errors that nothing would have caught.
      # `ai/` is excluded: it has pre-existing errors that predate this job.
      - name: Type-check
        run: |
          for f in supabase/functions/*/index.ts; do
            case "$f" in */ai/*) continue ;; esac
            echo "== $f"; deno check "$f"
          done

      # The probe's state machine decides whether a monitor failure wakes
      # someone up, so it is the piece that must not regress silently.
      - name: Unit tests
        run: deno test supabase/functions/
